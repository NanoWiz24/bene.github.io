<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Sensor Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-value {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: #667eea;
        }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        .unit {
            font-size: 1rem;
            color: #666;
            font-weight: normal;
        }

        .connection-status {
            text-align: center;
            color: white;
            margin-top: 20px;
        }

        .connected { color: #4CAF50; }
        .disconnected { color: #f44336; }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡️ Sensor Data Dashboard</h1>
            <div class="status">
                Status: <span id="connection-status" class="disconnected">Disconnected</span>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>🌡️ Temperature <span class="unit">°C</span></h3>
                <div id="temp-value" class="current-value">--</div>
                <div class="chart-container">
                    <canvas id="temp-chart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>⚡ ORP <span class="unit">mV</span></h3>
                <div id="orp-value" class="current-value">--</div>
                <div class="chart-container">
                    <canvas id="orp-chart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>🧪 pH <span class="unit">pH</span></h3>
                <div id="ph-value" class="current-value">--</div>
                <div class="chart-container">
                    <canvas id="ph-chart"></canvas>
                </div>
            </div>
        </div>

        <div class="connection-status">
            Last update: <span id="last-update">Never</span>
        </div>
    </div>

    <script>
        // Configuration - UPDATE THESE WITH YOUR DETAILS
        const config = {
            mqtt: {
                host: '10.0.0.169', // Replace with your MQTT broker
                port: 8083, // WebSocket port (usually 8083 for WS, 8884 for WSS)
                clientId: 'web-dashboard-' + Math.random().toString(16),
                topic: 'sensors/data' // Replace with your MQTT topic
            }
        };

        // Data storage
        const sensorData = {
            temp: [],
            orp: [],
            ph: []
        };

        // Chart instances
        const charts = {};

        // Initialize dashboard
        function initializeDashboard() {
            createCharts();
            connectMQTT();
        }

        // Create charts
        function createCharts() {
            const chartConfig = {
                type: 'line',
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 0
                    },
                    scales: {
                        x: {
                            type: 'realtime',
                            realtime: {
                                duration: 60000, // Show last 60 seconds
                                refresh: 1000,
                                delay: 2000
                            }
                        },
                        y: {
                            beginAtZero: false
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            };

            charts.temp = new Chart(
                document.getElementById('temp-chart'),
                {
                    ...chartConfig,
                    data: {
                        datasets: [{
                            label: 'Temperature',
                            data: [],
                            borderColor: '#ff6384',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    }
                }
            );

            charts.orp = new Chart(
                document.getElementById('orp-chart'),
                {
                    ...chartConfig,
                    data: {
                        datasets: [{
                            label: 'ORP',
                            data: [],
                            borderColor: '#36a2eb',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    }
                }
            );

            charts.ph = new Chart(
                document.getElementById('ph-chart'),
                {
                    ...chartConfig,
                    data: {
                        datasets: [{
                            label: 'pH',
                            data: [],
                            borderColor: '#4bc0c0',
                            backgroundColor: 'rgba(75, 192, 192, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    }
                }
            );
        }

        // Connect to MQTT
        function connectMQTT() {
            try {
                const client = new Paho.MQTT.Client(
                    config.mqtt.host,
                    config.mqtt.port,
                    config.mqtt.clientId
                );

                client.onConnectionLost = onConnectionLost;
                client.onMessageArrived = onMessageArrived;

                client.connect({
                    onSuccess: onConnect,
                    onFailure: onFailure,
                    useSSL: config.mqtt.port === 8884,
                    timeout: 3,
                    keepAliveInterval: 30
                });

                window.mqttClient = client;
            } catch (error) {
                console.error('MQTT Connection error:', error);
                updateConnectionStatus(false);
            }
        }

        function onConnect() {
            console.log('Connected to MQTT broker');
            updateConnectionStatus(true);
            window.mqttClient.subscribe(config.mqtt.topic);
        }

        function onFailure(error) {
            console.error('Connection failed:', error);
            updateConnectionStatus(false);
            // Retry connection after 5 seconds
            setTimeout(connectMQTT, 5000);
        }

        function onConnectionLost(response) {
            console.log('Connection lost:', response);
            updateConnectionStatus(false);
            // Attempt reconnect after 3 seconds
            setTimeout(connectMQTT, 3000);
        }

        function onMessageArrived(message) {
            try {
                const payload = JSON.parse(message.payloadString);
                processSensorData(payload);
                updateLastUpdateTime();
            } catch (error) {
                console.error('Error processing message:', error);
            }
        }

        function processSensorData(payload) {
            if (Array.isArray(payload)) {
                payload.forEach(item => {
                    const timestamp = new Date(item.time).getTime();
                    const value = parseFloat(item.value);

                    switch(item.tag) {
                        case "Temp":
                            updateSensorDisplay('temp', value, timestamp);
                            break;
                        case "ORP":
                            updateSensorDisplay('orp', value, timestamp);
                            break;
                        case "pH":
                            updateSensorDisplay('ph', value, timestamp);
                            break;
                    }
                });
            }
        }

        function updateSensorDisplay(type, value, timestamp) {
            // Update current value display
            document.getElementById(`${type}-value`).textContent = value.toFixed(2);

            // Update chart data (keep last 50 points)
            const dataPoint = { x: timestamp, y: value };
            sensorData[type].push(dataPoint);
            
            if (sensorData[type].length > 50) {
                sensorData[type].shift();
            }

            // Update chart
            charts[type].data.datasets[0].data = sensorData[type];
            charts[type].update('none');
        }

        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connection-status');
            if (connected) {
                statusElement.textContent = 'Connected';
                statusElement.className = 'connected';
            } else {
                statusElement.textContent = 'Disconnected';
                statusElement.className = 'disconnected';
            }
        }

        function updateLastUpdateTime() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleTimeString();
        }

        // Initialize the dashboard when page loads
        document.addEventListener('DOMContentLoaded', initializeDashboard);
    </script>
</body>
</html>
